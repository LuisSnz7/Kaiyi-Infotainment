name: Compilar Kaiyi Info Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Descomprimir y Compilar APK
        run: |
          unzip -q "KaiyiLauncher*" -d proyecto || unzip -q "*.zip" -d proyecto
          cd proyecto
          if [ -d "android" ]; then cd android; fi
          gradle assembleDebug
      - name: Subir APK listo
        uses: actions/upload-artifact@v4
        with:
          name: Kaiyi-Info-Pro-APK
          path: "**/app-debug.apk"
          
